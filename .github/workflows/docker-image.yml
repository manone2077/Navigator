name: Build and Push Docker Image on Release Branch

on:
  push:
    branches:
      - '**'        # 所有分支：运行测试；release/* 分支还会发布镜像
    tags:
      - '*'         # 标签：运行测试并发布镜像
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Build frontend
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Backend tests
        run: mvn -B verify

  release:
    name: 发布镜像
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref_type == 'tag' || startsWith(github.ref_name, 'release/')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with all history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要标签信息

      - name: Determine tag
        id: tag
        run: |
          SKIP=false
          if [ "${{ github.ref_type }}" == "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.ref_name }}" == release/* ]]; then
            # release/v1.0.8 -> v1.0.8，避免覆盖上一个版本的镜像
            TAG="${{ github.ref_name }}"
            TAG="${TAG#release/}"
            # 同一提交已打了标签时，由标签触发的构建负责推送，避免重复构建
            if [ -n "$(git tag --points-at HEAD | grep -E '^v' || true)" ]; then
              SKIP=true
            fi
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
          fi
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "skip=${SKIP}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}, skip: ${SKIP}"

      - name: Set up QEMU
        if: steps.tag.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.tag.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.tag.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 先构建 amd64 镜像到本地做冒烟测试，通过后才推送
      - name: Build image for smoke test
        if: steps.tag.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: navigator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (upgrade from current latest)
        if: steps.tag.outputs.skip != 'true'
        run: |
          PREV="${{ secrets.DOCKER_USERNAME }}/navigator:latest"
          docker pull "$PREV" || PREV=""
          docker/smoke-test.sh navigator:ci "$PREV"

      - name: Build and push Docker image
        if: steps.tag.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/navigator:latest
            ${{ secrets.DOCKER_USERNAME }}/navigator:${{ env.TAG }}
