name: Build and Push Docker Image on Release Branch

on:
  push:
    branches:
      - release/*  # 匹配所有以 release/ 开头的分支
    tags:
      - '*'  # 保留标签触发
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code with all history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensure all history is fetched to get tags

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.ref_name }}" == release/* ]]; then
            # release/v1.0.8 -> v1.0.8，避免覆盖上一个版本的镜像
            TAG="${{ github.ref_name }}"
            TAG="${TAG#release/}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
          fi
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "Image tag: ${TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/navigator:latest
            ${{ secrets.DOCKER_USERNAME }}/navigator:${{ env.TAG }}
