name: Build and Push Docker Image on Release Branch

on:
  push:
    branches:
      - release/*  # 匹配所有以 release/ 开头的分支
    tags:
      - '*'  # 保留标签触发
  workflow_dispatch:
    inputs:
      front_ref:
        description: '前端 Navigator_front 使用的分支或标签（留空则优先使用同名标签，否则 master）'
        required: false
        default: ''

env:
  FRONT_REPO: manone2077/Navigator_front

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code with all history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensure all history is fetched to get tags

      - name: Determine tag
        id: tag
        run: |
          SKIP=false
          if [ "${{ github.ref_type }}" == "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.ref_name }}" == release/* ]]; then
            # release/v1.0.8 -> v1.0.8，避免覆盖上一个版本的镜像
            TAG="${{ github.ref_name }}"
            TAG="${TAG#release/}"
            # 同一提交已打了标签时，由标签触发的构建负责推送，避免重复构建
            if [ -n "$(git tag --points-at HEAD | grep -E '^v' || true)" ]; then
              SKIP=true
            fi
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
          fi
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "skip=${SKIP}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}, skip: ${SKIP}"

      - name: Resolve frontend ref
        if: steps.tag.outputs.skip != 'true'
        run: |
          REF="${{ github.event.inputs.front_ref }}"
          if [ -z "$REF" ]; then
            if git ls-remote --exit-code --tags "https://github.com/${FRONT_REPO}.git" "refs/tags/${TAG}" >/dev/null; then
              REF="${TAG}"
            else
              REF="master"
            fi
          fi
          echo "FRONT_REF=${REF}" >> $GITHUB_ENV
          echo "Frontend ref: ${REF}"

      - name: Checkout frontend
        if: steps.tag.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONT_REPO }}
          ref: ${{ env.FRONT_REF }}
          path: front

      - name: Set up Node.js
        if: steps.tag.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: front/yarn.lock

      - name: Build frontend
        if: steps.tag.outputs.skip != 'true'
        working-directory: front
        run: |
          yarn install --frozen-lockfile
          NAV_DIST="${GITHUB_WORKSPACE}/docker/dist" yarn build

      - name: Set up JDK 17
        if: steps.tag.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        if: steps.tag.outputs.skip != 'true'
        run: mvn -B clean package

      - name: Set up QEMU
        if: steps.tag.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.tag.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.tag.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: steps.tag.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/navigator:latest
            ${{ secrets.DOCKER_USERNAME }}/navigator:${{ env.TAG }}
